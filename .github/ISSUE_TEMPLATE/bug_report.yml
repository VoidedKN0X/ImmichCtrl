name: Bug report
description: Something in ImmichCtrl doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Before you post, please remove server addresses, passwords, API keys, shared link addresses and other personal info from your text, logs and screenshots. Found a security problem? Please [report it privately](https://github.com/VoidedKN0X/ImmichCtrl/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: app-version
    attributes:
      label: ImmichCtrl version
      placeholder: Profile picture > bottom of the page, e.g. 0.6.3
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and phone
      placeholder: Android 15, Pixel 8
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Immich version
      placeholder: e.g. 2.1.0
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - GitHub Releases
        - Obtainium
        - CtrlF-Droid
        - Built it myself
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Settings > Logs can copy or share the app's log. Check it for anything private first.
