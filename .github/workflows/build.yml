name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_signed: ${{ steps.keystore.outputs.release_signed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Work out the version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          echo "version=${base}.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Version ${base}.${RUN_NUMBER}"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "release_signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing with release key"
          else
            echo "release_signed=false" >> "$GITHUB_OUTPUT"
            echo "::error::No KEYSTORE_BASE64 secret set - refusing to build a debug-signed release. Add the release key secrets."
            exit 1
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS || secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler and Gradle errors as annotations so they show on the run page and in the API.
          [ -f build.log ] || exit 0
          grep -E '^e: |^ERROR:|error: |What went wrong' -A 3 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Rename APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            cp "$f" "out/ImmichCtrl-v${VERSION}.apk"
          done
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ImmichCtrl-v${{ steps.version.outputs.version }}
          path: out/*.apk

  release:
    needs: build
    if: needs.build.outputs.release_signed == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            VERSION
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ImmichCtrl-v${{ needs.build.outputs.version }}
          path: out

      - name: Release notes from the changelog
        run: |
          # The section for this major.minor ("## 0.2 ..."), up to the next "## " heading.
          base="$(tr -d '[:space:]' < VERSION)"
          awk -v base="$base" '
            /^## / { if (found) exit; if (index($0, "## " base " ") == 1 || $0 == "## " base) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ImmichCtrl v${{ needs.build.outputs.version }}
          files: out/*.apk
          body_path: notes.md
          generate_release_notes: true
